[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calrcpsp"
version = "1.0.1"
description = "Calendar-aware resource-constrained project scheduling with max-plus algebra"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = [
    "project scheduling",
    "resource-constrained scheduling",
    "calendar constraints",
    "max-plus algebra",
    "RCPSP",
    "CA-RCPSP",
    "operations research",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26,<3.0",
]

[[project.authors]]
name = "Md Aftab Uddin"
email = "md.uddin@utbm.fr"

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]
dev = ["pytest>=8.0,<9.0", "ruff==0.16.8"]

[project.scripts]
calrcpsp = "calrcpsp.cli:main"

[project.urls]
Homepage = "https://github.com/aftab-fr/calrcpsp"
Repository = "https://github.com/aftab-fr/calrcpsp"
Issues = "https://github.com/aftab-fr/calrcpsp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
calrcpsp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly. Without this the rule set is whatever the installed
# ruff version happens to default to, which changes between releases.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "PERF", "ISC", "RUF"]
ignore = [
    # __all__ is grouped by topic to mirror the package layout, not sorted.
    "RUF022",
    # Trying each candidate format in turn is the clearest way to parse the
    # time and dependency fields, and neither loop is in a hot path.
    "PERF203",
]

[tool.ruff.lint.per-file-ignores]
# The benchmark runner must record a failure and carry on, not abort the run.
"scripts/run_benchmark.py" = ["BLE001"]
